# zapagente — infra ENXUTA para VPS pequena (demo, ex.: 1 vCPU / 4 GB).
# Diferença vs docker-compose.yml (o original, para escala): UM único Postgres serve
# tanto o app (db "zapagente") quanto a Evolution (db "evolution"), economizando a RAM
# de um segundo servidor Postgres. O init-db/ cria o banco "evolution" na 1ª subida.
#
# ⚠️ Numa VPS de 4 GB, CONFIGURE SWAP antes de subir (ver docs/DEPLOY.md) — o Baileys
# (Evolution) come RAM e sem swap o host pode travar (OOM).
#
# Uso na VPS:  docker compose -f infra/docker-compose.demo.yml up -d

services:
  # ─── Postgres ÚNICO: hospeda os bancos "zapagente" (app) e "evolution" ───
  db:
    image: postgres:16-alpine
    container_name: zapagente-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zapagente
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zapagente}
      POSTGRES_DB: zapagente
    ports:
      - "127.0.0.1:5432:5432" # só localhost — nunca exposto na internet
    volumes:
      - zapagente_pgdata:/var/lib/postgresql/data
      # cria o banco/usuário da Evolution na 1ª inicialização (data dir vazio)
      - ./init-db:/docker-entrypoint-initdb.d:ro
    # config leve p/ VPS pequena (menos memória reservada)
    command: >
      postgres -c shared_buffers=96MB -c max_connections=50 -c effective_cache_size=512MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zapagente"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Evolution API — ponte WhatsApp (Baileys / não-oficial) ───
  # Usa o MESMO Postgres (banco "evolution") + Redis próprio.
  evolution:
    image: evoapicloud/evolution-api:v2.3.1
    container_name: zapagente-evolution
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      evolution_redis:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080" # NÃO expor a Evolution na internet
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-zapagente-dev-key}
      SERVER_URL: http://localhost:8080
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      # aponta pro Postgres compartilhado (serviço "db"), banco "evolution"
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@db:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: zapagente
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution_redis:6379/0
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances

  evolution_redis:
    image: redis:7-alpine
    container_name: zapagente-evolution-redis
    restart: unless-stopped
    # Redis leve: teto de memória + descarta chaves antigas sob pressão
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - evolution_redis:/data

volumes:
  zapagente_pgdata:
  evolution_redis:
  evolution_instances:
