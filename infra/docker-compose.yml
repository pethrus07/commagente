# zapagente — infra de desenvolvimento
# Fatia 1 (Fundação): só o Postgres — suficiente pra rodar as migrations e o Prisma Studio.
# A Evolution API entra na Fatia 2 (Conexão). api/painel são dockerizados no deploy de produção (VPS).

services:
  db:
    image: postgres:16-alpine
    container_name: zapagente-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zapagente
      POSTGRES_PASSWORD: zapagente
      POSTGRES_DB: zapagente
    ports:
      - "5432:5432"
    volumes:
      - zapagente_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zapagente"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zapagente_pgdata:
